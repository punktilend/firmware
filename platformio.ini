[env:saornet_ra02]
extends = esp32_base
board = esp32dev
build_flags = 
	${esp32_base.build_flags}
	-D LORA_USE_SX1278=1
	-I variants/saornet_ra02
platform_packages = platformio/tool-mklittlefs@^1.203.210628

[portduino_base]
platform = 
	https://github.com/meshtastic/platform-native/archive/f566d364204416cdbf298e349213f7d551f793d9.zip
framework = arduino
build_src_filter = 
	${env.build_src_filter}
	-<platform/esp32/>
	-<nimble/>
	-<platform/nrf52/>
	-<platform/stm32wl/>
	-<platform/rp2xx0>
	-<mesh/wifi/>
	-<mesh/http/>
	+<mesh/raspihttp/>
	-<mesh/eth/>
	-<modules/esp32>
lib_deps = 
	${env.lib_deps}
	${networking_base.lib_deps}
	${networking_extra.lib_deps}
	${radiolib_base.lib_deps}
	${environmental_base.lib_deps}
	rweather/Crypto@0.4.0
	lovyan03/LovyanGFX@1.2.19
	https://github.com/pine64/libch341-spi-userspace/archive/23c42319a69cffcb65868e3c72e6bed83974a393.zip
	adafruit/Adafruit seesaw Library@1.7.9
	https://github.com/RAKWireless/RAK12034-BMX160/archive/dcead07ffa267d3c906e9ca4a1330ab989e957e2.zip
	adafruit/Adafruit BME680 Library@^2.0.5
build_flags = 
	${arduino_base.build_flags}
	-D ARCH_PORTDUINO
	-fPIC
	-D_FORTIFY_SOURCE=2
	-fstack-protector-all -Wstack-protector --param ssp-buffer-size=4
	-Isrc/platform/portduino
	-DRADIOLIB_EEPROM_UNSUPPORTED
	-DPORTDUINO_LINUX_HARDWARE
	-DHAS_UDP_MULTICAST=1
	-lpthread
	-lstdc++fs
	-lbluetooth
	-lgpiod
	-lyaml-cpp
	-li2c
	-luv
	-std=gnu17
	-std=c++17
lib_ignore = 
	Adafruit NeoPixel
	Adafruit ST7735 and ST7789 Library
	SD

[nrf52_base]
platform = 
	platformio/nordicnrf52@10.10.0
extends = arduino_base
platform_packages = 
	platformio/framework-arduinoadafruitnrf52 @ https://github.com/meshtastic/Adafruit_nRF52_Arduino#74096746e5f167a2ff22e483d8e79bb1aef00591
	platformio/toolchain-gccarmnoneeabi@~1.90301.0
extra_scripts = 
	${env.extra_scripts}
	extra_scripts/nrf52_extra.py
build_type = release
build_flags = 
	-include variants/nrf52840/cpp_overrides/lfs_util.h
	${arduino_base.build_flags}
	-Wno-unused-variable
	-Isrc/platform/nrf52
	-DLFS_NO_ASSERT
	-DMESHTASTIC_EXCLUDE_AUDIO=1
	-DMESHTASTIC_EXCLUDE_PAXCOUNTER=1
	-Os
build_unflags = 
	-Ofast
	-Og
	-ggdb3
	-ggdb2
	-g3
	-g2
	-g
	-g1
	-g0
build_src_filter = 
	${arduino_base.build_src_filter} -<platform/esp32/> -<platform/stm32wl> -<nimble/> -<mesh/wifi/> -<mesh/api/> -<mesh/http/> -<modules/esp32> -<platform/rp2xx0> -<mesh/eth/> -<mesh/raspihttp> -<serialization/>
lib_deps = 
	${arduino_base.lib_deps}
	${radiolib_base.lib_deps}
	rweather/Crypto@0.4.0
lib_ignore = 
	BluetoothOTA
	lvgl

[nrf52832_base]
extends = nrf52_base
build_flags = 
	${nrf52_base.build_flags}
	-DSERIAL_BUFFER_SIZE=1024

[nrf52840_base]
extends = nrf52_base
build_flags = 
	${nrf52_base.build_flags}
	-DSERIAL_BUFFER_SIZE=4096
lib_deps = 
	${nrf52_base.lib_deps}
	${environmental_base.lib_deps}
	${environmental_extra.lib_deps}
	https://github.com/Kongduino/Adafruit_nRFCrypto/archive/8cde7189b5ead9dcd49f72601b43b969c0bbc06e.zip
debug_init_break = tbreak setup
debug_extra_cmds = 
	echo Running .gdbinit script
	commands 1
	set useSoftDevice = 0
	end
debug_load_mode = modified
debug_tool = stlink
debug_speed = 4000

